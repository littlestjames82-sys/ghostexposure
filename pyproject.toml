[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostexposure"
version = "0.1.0"
description = "Audit bundles with proof of exclusion, built on GhostSlice. Evidence only: partitions, manifests, verification."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ghostexposure = "ghostexposure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
